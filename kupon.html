<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generator Kupon - MINSOCSENT</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="css/kupon.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Generator Kupon</h1>
        <p>Generate kupon dengan nomor otomatis dan nomor double</p>
    </header>

    <div class="panel">

        <div class="form-group">
            <label for="designInput">
                Desain Kupon
            </label>

            <input
                type="file"
                id="designInput"
                accept="image/png,image/jpeg,image/jpg,image/webp"
            >

            <div id="designStatus" class="design-status">
                Belum ada desain
            </div>
        </div>


        <div class="row">

            <div class="form-group">
                <label for="startNumber">
                    Nomor Awal
                </label>

                <input
                    type="number"
                    id="startNumber"
                    value="1"
                    min="0"
                >
            </div>


            <div class="form-group">
                <label for="totalNumber">
                    Total Nomor
                </label>

                <input
                    type="number"
                    id="totalNumber"
                    value="100"
                    min="1"
                >
            </div>

        </div>


        <div class="row">

            <div class="form-group">
                <label for="columns">
                    Kolom per A4
                </label>

                <input
                    type="number"
                    id="columns"
                    value="2"
                    min="1"
                    max="10"
                >
            </div>


            <div class="form-group">
                <label for="rows">
                    Baris per A4
                </label>

                <input
                    type="number"
                    id="rows"
                    value="5"
                    min="1"
                    max="20"
                >
            </div>

        </div>


        <div class="row">

            <div class="form-group">
                <label for="padding">
                    Jumlah Digit
                </label>

                <input
                    type="number"
                    id="padding"
                    value="4"
                    min="1"
                    max="10"
                >
            </div>


            <div class="form-group">
                <label for="gap">
                    Gap Kupon (mm)
                </label>

                <input
                    type="number"
                    id="gap"
                    value="2"
                    min="0"
                    step="0.1"
                >
            </div>

        </div>


        <div class="form-group">

            <label for="numberPosition">
                Posisi Nomor
            </label>

            <select id="numberPosition">

                <option value="auto">
                    Otomatis Deteksi Desain
                </option>

                <option value="top-left">
                    Kiri Atas
                </option>

                <option value="top-center">
                    Tengah Atas
                </option>

                <option value="top-right">
                    Kanan Atas
                </option>

                <option value="center">
                    Tengah
                </option>

                <option value="bottom-left">
                    Kiri Bawah
                </option>

                <option value="bottom-center">
                    Tengah Bawah
                </option>

                <option value="bottom-right">
                    Kanan Bawah
                </option>

            </select>

        </div>


        <div id="detectionResult" class="detection-result">

            <i class="bi bi-search"></i>

            <span>
                Upload desain untuk mendeteksi area nomor.
            </span>

        </div>


        <button id="generateBtn">
            <i class="bi bi-magic"></i>
            Generate Kupon
        </button>


        <button
            id="printBtn"
            class="secondary"
        >
            <i class="bi bi-printer"></i>
            Print / Simpan PDF
        </button>

    </div>


    <div class="info">

        <div>
            <strong id="perPage">10</strong>
            <span>Kupon per halaman</span>
        </div>

        <div>
            <strong id="pageCount">1</strong>
            <span>Total halaman</span>
        </div>

    </div>


    <h2>Preview</h2>

    <div id="preview"></div>

</div>


<script src="js/kupon.js"></script>

</body>
</html>
