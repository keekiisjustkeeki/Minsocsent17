<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kupon Gerak Jalan</title>
    <link rel="stylesheet" href="css/kupon.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Generator Kupon</h1>
        <p>Generator kupon gerak jalan otomatis</p>
    </header>

    <section class="panel">

        <div class="form-group">
            <label>Upload Desain Kupon</label>
            <input type="file" id="designInput" accept="image/png,image/jpeg">
        </div>

        <div class="row">

            <div class="form-group">
                <label>Nomor Mulai</label>
                <input type="number" id="startNumber" value="1" min="0">
            </div>

            <div class="form-group">
                <label>Jumlah Nomor</label>
                <input type="number" id="totalNumber" value="100" min="1">
            </div>

        </div>

        <div class="row">

            <div class="form-group">
                <label>Kolom / Grid X</label>
                <input type="number" id="columns" value="5" min="1">
            </div>

            <div class="form-group">
                <label>Baris / Grid Y</label>
                <input type="number" id="rows" value="10" min="1">
            </div>

        </div>

        <div class="row">

            <div class="form-group">
                <label>Padding Nomor</label>
                <input type="number" id="padding" value="4" min="1" max="10">
            </div>

            <div class="form-group">
                <label>Jarak Antar Kupon (mm)</label>
                <input type="number" id="gap" value="1" min="0" step="0.5">
            </div>

        </div>

        <div class="form-group">
            <label>Posisi Nomor</label>

            <select id="numberPosition">
                <option value="top-left">Kiri Atas</option>
                <option value="top-center">Tengah Atas</option>
                <option value="top-right">Kanan Atas</option>
                <option value="center">Tengah</option>
                <option value="bottom-left">Kiri Bawah</option>
                <option value="bottom-center" selected>Tengah Bawah</option>
                <option value="bottom-right">Kanan Bawah</option>
            </select>

        </div>

        <button id="generateBtn">
            GENERATE KUPON
        </button>

        <button id="printBtn" class="secondary">
            CETAK / SIMPAN PDF
        </button>

    </section>

    <section class="info">
        <div>
            <strong id="perPage">50</strong>
            <span>Kupon / halaman</span>
        </div>

        <div>
            <strong id="pageCount">2</strong>
            <span>Total halaman</span>
        </div>
    </section>

    <section>
        <h2>Preview</h2>
        <div id="preview"></div>
    </section>

</div>

<script src="js/kupon.js"></script>

</body>
</html>
